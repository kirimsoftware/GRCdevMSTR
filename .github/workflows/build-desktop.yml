name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3) — runner macos-latest sekarang ARM
          - os: macos-latest
            label: macos-applesilicon
            arch: arm64
          # Intel (Mac 2020 & sebelumnya) — 'macos-13' sudah di-retire Des 2025.
          # 'macos-15-intel' adalah runner Intel resmi pengganti (berlaku s/d Agu 2027).
          - os: macos-15-intel
            label: macos-intel
            arch: x86_64
          - os: windows-latest
            label: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview imageio-ffmpeg cryptography
          pip install --force-reinstall --no-deps "numpy==1.26.4"
          python -c "import numpy; print('BUILD numpy version:', numpy.__version__); assert numpy.__version__ == '1.26.4', 'WRONG NUMPY'"

      - name: Build with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: pyinstaller masteringauds.spec --noconfirm

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/GRCmasteringStudio.app"
          # Tanda tangani SEMUA nested binary (.dylib/.so) lebih dulu, dari dalam ke luar.
          # Apple tidak menyarankan '--deep'; pada bundle dgn banyak lib native
          # (numpy/scipy) '--deep' sering menghasilkan signature tak konsisten yg
          # membuat Gatekeeper menolak. Sign per-file jauh lebih andal.
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp=none --sign - "{}" || true
          # Lalu tanda tangani bundle utama paling akhir.
          codesign --force --timestamp=none --sign - "$APP"
          # Verifikasi signature valid (jangan gagalkan build kalau ad-hoc, hanya log).
          codesign --verify --verbose=2 "$APP" || echo "[warn] verifikasi codesign ad-hoc (wajar untuk unsigned dev build)"

      - name: Package .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GRCmasteringStudio.app "GRCmasteringStudio-${{ matrix.label }}.zip"

      - name: Package .exe folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GRCmasteringStudio -DestinationPath "dist/GRCmasteringStudio-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRCmasteringStudio-${{ matrix.label }}
          path: dist/GRCmasteringStudio-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GRCmasteringStudio-*.zip
